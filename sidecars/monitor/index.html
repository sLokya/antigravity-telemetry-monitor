<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity Fleet & Speed Telemetry HUD</title>
  <script src="/preload.js"></script>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --hud-surface: var(--card, #ffffff);
      --hud-subtle: color-mix(in srgb, var(--background, #f4f6f9) 68%, var(--card, #ffffff) 32%);
      --hud-border: color-mix(in srgb, var(--border, #e2e8f0) 82%, #64748b 18%);
      --hud-hairline: color-mix(in srgb, var(--border, #e2e8f0) 65%, transparent 35%);
      --hud-ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    body { background: var(--background, #f6f8fa); color: var(--foreground, #0f172a); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif; font-size: 13px; line-height: 1.35; }
    .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Monaco, Consolas, monospace; font-variant-numeric: tabular-nums; }
    .tnum { font-variant-numeric: tabular-nums; }
    @keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.38; transform: scale(0.88); } }
    .pulse-live { animation: pulse-dot 1.4s infinite ease-in-out; }
    .hud-shell { max-width: 960px; margin: 0 auto; }
    .hud-topbar { container-type: inline-size; position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--background, #f6f8fa) 90%, transparent 10%); backdrop-filter: blur(8px); border-bottom: 1px solid var(--hud-border); }
    .hud-btn { font-size: 11px; line-height: 1; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--hud-border); background: var(--hud-surface); color: var(--muted-foreground, #64748b); font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; gap: 3px; transition: border-color 160ms var(--hud-ease), color 160ms var(--hud-ease), background-color 160ms var(--hud-ease); }
    .hud-btn:hover { border-color: rgba(14, 165, 233, 0.5); color: var(--foreground, #0f172a); }
    @container (max-width: 470px) { .topbar-wide-only { display: none; } }
    @container (max-width: 620px) { .topbar-xl-only { display: none; } }
    .hud-menu-popover { margin: 0; position: fixed; top: 44px; right: 10px; left: auto; bottom: auto; min-width: 176px; padding: 6px; border-radius: 10px; border: 1px solid var(--hud-border); background: var(--hud-surface); color: var(--foreground, #0f172a); box-shadow: 0 10px 28px -6px rgba(15, 23, 42, 0.18), 0 2px 6px rgba(15, 23, 42, 0.08); }
    .hud-menu-popover:is(:popover-open, .\:popover-open) { display: flex; flex-direction: column; gap: 4px; }
    @supports not selector(:popover-open) { .hud-menu-popover:not(.\:popover-open) { display: none; } }
    .hud-menu-item { width: 100%; justify-content: space-between; padding: 6px 8px; border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--foreground, #0f172a); font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 8px; cursor: pointer; transition: background-color 140ms var(--hud-ease), border-color 140ms var(--hud-ease); }
    .hud-menu-item:hover { background: var(--hud-subtle); border-color: var(--hud-hairline); }
    .kpi-tile { background: var(--hud-surface); border: 1px solid var(--hud-border); }
    .quota-matrix { background: var(--hud-surface); border: 1px solid var(--hud-border); border-radius: 10px; padding: 6px 10px; container-type: inline-size; }
    .quota-row { display: grid; grid-template-columns: 62px minmax(0, 1fr) minmax(0, 1fr); align-items: center; gap: 8px; padding: 3px 0; }
    .quota-row + .quota-row { border-top: 1px solid var(--hud-hairline); }
    .quota-cell { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .quota-track { flex: 1; min-width: 24px; height: 5px; border-radius: 999px; background: var(--hud-subtle); overflow: hidden; }
    .quota-clock { display: none; }
    @container (min-width: 520px) { .quota-clock { display: inline; } }
    @container (max-width: 360px) { .quota-row { grid-template-columns: 54px minmax(0, 1fr); } .quota-cell-wk { grid-column: 2; } }
    .task-card { container-type: inline-size; background: var(--hud-surface); border: 1px solid var(--hud-border); border-radius: 10px; transition: border-color 160ms var(--hud-ease), background-color 160ms var(--hud-ease); }
    .task-card:hover { border-color: color-mix(in srgb, var(--hud-border) 55%, #0ea5e9 45%); }
    .task-card-running { border-color: rgba(14, 165, 233, 0.42); background: linear-gradient(90deg, rgba(14, 165, 233, 0.045) 0%, var(--hud-surface) 24%); }
    .task-card-bg { border-color: rgba(139, 92, 246, 0.44); background: linear-gradient(90deg, rgba(139, 92, 246, 0.05) 0%, var(--hud-surface) 26%); }
    .task-kpi-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 5px 0; border-top: 1px solid var(--hud-hairline); border-bottom: 1px solid var(--hud-hairline); }
    @container (max-width: 380px) { .task-kpi-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 10px; } }
    .bg-task-tray { background: linear-gradient(135deg, rgba(99, 102, 241, 0.06) 0%, rgba(14, 165, 233, 0.03) 100%); border: 1px solid rgba(99, 102, 241, 0.25); }
    @media (prefers-reduced-motion: reduce) { .pulse-live { animation: none !important; } .hud-btn, .hud-menu-item, .task-card { transition: none !important; } }
  </style>
</head>
<body class="select-none antialiased">
  <div class="hud-shell px-2 pb-3 space-y-2">
    <!-- Compact Single-Row Sticky Topbar -->
    <header class="hud-topbar py-1.5 -mx-2 px-2 flex items-center justify-between gap-1.5 flex-nowrap">
      <div class="flex items-center gap-1.5 min-w-0 flex-1 overflow-hidden">
        <span id="fleetDot" class="w-2 h-2 rounded-full bg-emerald-500 pulse-live shrink-0"></span>
        <h1 id="hudTitleText" class="text-[13px] font-bold tracking-tight truncate text-[var(--foreground)]">并行任务监控台</h1>
        <span id="fleetRunningBadge" class="text-[11px] mono font-semibold text-sky-600 dark:text-sky-400 shrink-0 whitespace-nowrap">0</span>
        <span id="fleetBgBadge" class="hidden text-[11px] mono text-violet-600 dark:text-violet-400 font-semibold shrink-0 whitespace-nowrap"></span>
        <span id="fleetCodexBadge" class="hidden topbar-xl-only text-[11px] mono text-[var(--muted-foreground)] shrink-0 whitespace-nowrap"></span>
      </div>

      <div class="flex items-center gap-1 shrink-0">
        <div class="inline-flex items-center p-0.5 rounded-md bg-[var(--hud-surface)] border border-[var(--hud-border)]">
          <button id="filterRunBtn" type="button" aria-pressed="true" title="展示进行中任务及今日未归档的近期对话，进行中的默认置顶" class="text-[11px] leading-none px-1.5 py-1 rounded bg-sky-500 text-white font-semibold whitespace-nowrap">
            <span id="filterRunLabel">活跃</span> <span id="filterRunCount" class="mono opacity-90">0</span>
          </button>
          <button id="filterAllBtn" type="button" aria-pressed="false" class="text-[11px] leading-none px-1.5 py-1 rounded text-[var(--muted-foreground)] hover:text-[var(--foreground)] font-medium whitespace-nowrap">
            <span id="filterAllLabel">全部</span> <span id="filterAllCount" class="mono opacity-75">0</span>
          </button>
        </div>
        <button id="filterCodexBtn" type="button" aria-pressed="false" title="切换是否在当前视图中显示 Codex 对话" class="hud-btn">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 shrink-0"></span><span id="filterCodexLabel">CX</span> <span id="filterCodexCount" class="mono opacity-80">0</span>
        </button>
        <button id="quotaCalibBtn" type="button" aria-expanded="false" onclick="toggleQuotaCalibDrawer(event)" title="单人配额校准与估算偏高自检" class="hud-btn">
          <span>⚖️</span><span id="quotaCalibBtnLabel" class="topbar-wide-only">校准</span>
        </button>
        <button id="refreshBtn" type="button" title="刷新" class="hud-btn px-1.5">
          <span>↻</span><span id="refreshBtnLabel" class="sr-only">刷新</span>
        </button>
        <button id="hudMoreBtn" type="button" popovertarget="hudOverflowMenu" title="更多工具（签名头 / 语言 / 版本）" class="hud-btn px-1.5 relative">
          <span class="font-bold tracking-widest">⋯</span>
          <span id="hudMoreAlertDot" class="hidden w-1.5 h-1.5 rounded-full bg-amber-500 absolute -top-0.5 -right-0.5"></span>
        </button>
      </div>
    </header>

    <!-- Secondary Tools Popover (Native Popover API) -->
    <div id="hudOverflowMenu" popover="auto" class="hud-menu-popover">
      <button id="fpLedgerBtn" type="button" onclick="closeHudMenu(); toggleFpLedgerDrawer()" title="Thinking signature header ledger" class="hud-menu-item">
        <span class="flex items-center gap-1.5"><span>🔑</span><span id="fpLedgerBtnLabel"><span id="fpLedgerBtnLabelBase">签名头</span></span></span>
        <span id="fpLedgerMenuHint" class="text-[10px] mono text-[var(--muted-foreground)]"></span>
      </button>
      <button id="langToggleBtn" type="button" onclick="toggleHudLang(); closeHudMenu()" title="Switch language / 切换语言" class="hud-menu-item">
        <span class="flex items-center gap-1.5"><span>🌐</span><span>Language / 语言</span></span>
        <span id="langToggleLabel" class="text-[11px] mono font-semibold text-sky-600 dark:text-sky-400">EN</span>
      </button>
      <button id="pluginUpdateBtn" type="button" aria-expanded="false" onclick="closeHudMenu(); togglePluginUpdateDrawer(event)" title="检查或更新插件" class="hud-menu-item">
        <span class="flex items-center gap-1.5"><span>⬆️</span><span>插件版本</span></span>
        <span id="pluginUpdateBtnLabel" class="text-[11px] mono text-[var(--muted-foreground)]">v1.2</span>
      </button>
    </div>

    <div id="actionToast" class="hidden text-xs mono px-3 py-1.5 rounded-lg border shadow-sm flex items-center justify-between">
      <span id="actionToastText" class="font-medium">--</span>
      <button onclick="document.getElementById('actionToast').classList.add('hidden')" class="text-xs opacity-70 hover:opacity-100 px-1">✕</button>
    </div>
    <div id="fpAlertBanner" class="hidden rounded-lg border border-rose-500/50 bg-rose-500/10 px-2.5 py-1.5 text-xs"></div>
    <div id="quotaCalibAlert" class="hidden rounded-lg border border-amber-500/50 bg-amber-500/10 px-2.5 py-1.5 text-xs space-y-1"></div>
    <div id="fpLedgerDrawer" class="hidden kpi-tile rounded-xl p-2.5 space-y-2 border-indigo-500/35"></div>
    <div id="quotaCalibDrawer" class="hidden kpi-tile rounded-xl p-2.5 space-y-2 border-sky-500/35"></div>
    <div id="pluginUpdateDrawer" class="hidden kpi-tile rounded-xl p-2.5 space-y-2 border-emerald-500/35"></div>

    <!-- Unified Compact Quota Matrix (5h + 7d side-by-side per pool) -->
    <section class="quota-matrix" aria-label="Account Quotas">
      <div class="quota-row pb-1 pt-0 text-[10px] font-semibold text-[var(--muted-foreground)] border-b border-[var(--hud-hairline)]">
        <span class="truncate">配额池</span>
        <span class="flex items-center justify-between gap-1 min-w-0">
          <span id="quota5hLabel" class="truncate">5小时余量</span>
          <span class="mono opacity-75 shrink-0">5h</span>
        </span>
        <span class="flex items-center justify-between gap-1 min-w-0 quota-cell-wk">
          <span id="quota7dLabel" class="truncate">周窗口余量</span>
          <span class="mono opacity-75 shrink-0">7d</span>
        </span>
      </div>
      <div id="quotaMatrixList" class="text-[11px] mono">
        <div class="text-[11px] text-[var(--muted-foreground)] py-1">--</div>
      </div>
    </section>

    <!-- Conversation & Background Task Cards Container -->
    <main id="fleetTasksContainer" class="space-y-1.5">
      <div id="initialScanningMsg" class="text-xs text-[var(--muted-foreground)] text-center py-4">...</div>
    </main>
  </div>

  <script>
    const refreshBtn = document.getElementById('refreshBtn');

    // View state: 'active' | 'all' (+ independent window.showCodexTasks toggle managed in ui_fleet_cards.js)
    window.selectedConvId = null;
    window.currentFilterMode = 'active';
    window.lastPayload = null;

    // Track open background log drawers: key = `${convId}:${stepIndex}` -> log string
    window.openBgLogs = new Map();
    const openBgLogs = window.openBgLogs;
    // Track open Codex progress timeline drawers: Set of convId
    const openCodexTimelines = new Set();

    function showToast(msg, isError = false) {
      const toast = document.getElementById('actionToast');
      const text = document.getElementById('actionToastText');
      text.textContent = msg;
      toast.className = isError
        ? 'text-xs mono px-3 py-2 rounded-xl border border-rose-500/40 bg-rose-500/15 text-rose-600 dark:text-rose-400 flex items-center justify-between shadow-sm'
        : 'text-xs mono px-3 py-2 rounded-xl border border-sky-500/40 bg-sky-500/15 text-sky-600 dark:text-sky-400 flex items-center justify-between shadow-sm';
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3500);
    }

    function reloadWithCacheBust(ver) {
      try {
        const u = new URL(window.location.href);
        u.searchParams.set('_v', ver ? String(ver) : String(Date.now()));
        window.location.replace(u.toString());
      } catch {
        window.location.reload();
      }
    }

    window.closeHudMenu = function () {
      const menu = document.getElementById('hudOverflowMenu');
      if (!menu) return;
      if (typeof menu.hidePopover === 'function') {
        try { menu.hidePopover(); } catch {}
      } else {
        menu.classList.remove(':popover-open');
      }
    };

    // Fallback toggle for browsers without native Popover API
    if (!Object.hasOwn(HTMLElement.prototype, 'popover')) {
      const moreBtn = document.getElementById('hudMoreBtn');
      const menu = document.getElementById('hudOverflowMenu');
      moreBtn?.addEventListener('click', (e) => {
        e.stopPropagation();
        menu?.classList.toggle(':popover-open');
      });
      document.addEventListener('click', (e) => {
        if (menu && !menu.contains(e.target) && e.target !== moreBtn) {
          menu.classList.remove(':popover-open');
        }
      });
    }

    window.syncHudMoreDot = function () {
      const dot = document.getElementById('hudMoreAlertDot');
      if (!dot) return;
      const d = window.lastPayload || {};
      const fpAlert = (d.fingerprintLedger?.unackedCount || 0) > 0 ||
        (d.fingerprintLedger?.baselines || []).some((b) => b.status === 'CHANGED');
      const updAlert = Boolean(d.pluginUpdate?.needsReload || (d.pluginUpdate?.hasUpdate && !d.pluginUpdate?.dismissed));
      dot.classList.toggle('hidden', !(fpAlert || updAlert));
    };

    refreshBtn.addEventListener('click', () => reloadWithCacheBust());

    window.selectTaskForDrilldown = function(convId) {
      if (window.selectedConvId === convId) {
        window.selectedConvId = null;
        if (window.lastPayload) renderFleet(window.lastPayload);
        return;
      }
      window.selectedConvId = convId;
      if (window.lastPayload) renderFleet(window.lastPayload);
      fetchTelemetry();
    };

    window.jumpToConversation = async function(event, convId) {
      event.stopPropagation();
      if (String(convId).startsWith('codex:')) {
        try {
          const res = await callActionApi({
            action: 'open_codex_thread',
            threadId: String(convId).replace(/^codex:/, ''),
          });
          showToast(res.ok ? res.message : `跳转 Codex 失败: ${res.error}`, !res.ok);
        } catch (err) {
          showToast(`跳转 Codex 异常: ${err.message}`, true);
        }
        return;
      }
      if (window.sidecar?.ui?.toggleConversation) {
        window.sidecar.ui.toggleConversation(convId);
      }
    };

    window.toggleCodexTimeline = function(event, convId) {
      event.stopPropagation();
      if (openCodexTimelines.has(convId)) {
        openCodexTimelines.delete(convId);
      } else {
        openCodexTimelines.add(convId);
      }
      if (lastPayload) renderFleet(lastPayload);
    };

    window.stopCodexTurn = async function(event, threadId) {
      event.stopPropagation();
      const btn = event.currentTarget;
      if (btn) {
        btn.disabled = true;
        btn.textContent = '停止中...';
      }
      try {
        const res = await callActionApi({ action: 'stop_codex_turn', threadId });
        showToast(res.ok ? res.message : `停止失败: ${res.error}`, !res.ok);
        await fetchTelemetry();
      } catch (err) {
        showToast(`停止异常: ${err.message}`, true);
      }
    };

    async function callActionApi(payload) {
      const fetcher = window.sidecar?.fetch || fetch;
      const res = await fetcher('/api/action', {
        method: 'POST',
        body: JSON.stringify(payload),
      });
      return res.json();
    }

    // Stop specific background task(s) (task-XX) instead of stopping the conversation turn itself
    window.killBgTask = async function(event, convId, stepIndexOrArray) {
      event.stopPropagation();
      const btn = event.currentTarget;
      if (btn) {
        btn.disabled = true;
        btn.textContent = '正在停止...';
      }
      try {
        const payload = Array.isArray(stepIndexOrArray)
          ? { action: 'kill_bg_task', conversationId: convId, stepIndices: stepIndexOrArray }
          : { action: 'kill_bg_task', conversationId: convId, stepIndex: stepIndexOrArray };
        const res = await callActionApi(payload);
        showToast(res.ok ? res.message : `停止失败: ${res.error}`, !res.ok);
        await fetchTelemetry();
      } catch (err) {
        showToast(`请求异常: ${err.message}`, true);
      }
    };

    window.toggleBgLog = async function(event, convId, stepIndex, forceRefresh = false) {
      event.stopPropagation();
      const key = `${convId}:${stepIndex}`;
      if (openBgLogs.has(key) && !forceRefresh) {
        openBgLogs.delete(key);
        if (lastPayload) renderFleet(lastPayload);
        return;
      }
      openBgLogs.set(key, '正在读取日志...');
      if (lastPayload) renderFleet(lastPayload);
      try {
        const res = await callActionApi({
          action: 'tail_bg_log',
          conversationId: convId,
          stepIndex,
        });
        openBgLogs.set(key, res.ok ? res.log : `读取失败: ${res.error}`);
        if (lastPayload) renderFleet(lastPayload);
      } catch (err) {
        openBgLogs.set(key, `读取异常: ${err.message}`);
        if (lastPayload) renderFleet(lastPayload);
      }
    };

    window.copyBgCmd = function(event, encodedCmd) {
      event.stopPropagation();
      const cmd = decodeURIComponent(encodedCmd || '');
      if (!cmd) return;
      navigator.clipboard?.writeText(cmd);
      showToast(`已复制命令: ${cmd.slice(0, 50)}${cmd.length > 50 ? '...' : ''}`);
    };

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function fmtNum(n) {
      if (n === null || n === undefined || isNaN(n)) return '--';
      if (n >= 1000000) return (n / 1000000).toFixed(2) + 'M';
      if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
      return String(n);
    }

    function fmtCacheK(n) {
      if (n === null || n === undefined || isNaN(n)) return '--k';
      if (n === 0) return '0k';
      return (n / 1000).toFixed(1) + 'k';
    }

    function fmtAgo(mtimeMs) {
      if (!mtimeMs) return '';
      const sec = Math.max(0, Math.floor((Date.now() - mtimeMs) / 1000));
      if (sec < 5) return tHud('agoJust');
      if (sec < 60) return `${sec}s`;
      const min = Math.floor(sec / 60);
      if (min < 60) return `${min}m`;
      return `${Math.floor(min / 60)}h`;
    }

    function fmtElapsed(sec) {
      const s = Math.max(0, Math.floor(Number(sec) || 0));
      if (s < 60) return `${s}s`;
      const m = Math.floor(s / 60);
      const remS = s % 60;
      if (m < 60) return `${m}m ${remS}s`;
      const h = Math.floor(m / 60);
      const remM = m % 60;
      return `${h}h ${remM}m`;
    }

    function fmtResetCountdown(diffMs) {
      if (diffMs <= 0) return tHud('quotaResetSoon');
      const totalMins = Math.ceil(diffMs / 60000);
      if (totalMins < 60) return `${totalMins}m`;
      const totalHours = Math.floor(totalMins / 60);
      const remMins = totalMins % 60;
      if (totalHours < 24) return remMins > 0 ? `${totalHours}h${remMins}m` : `${totalHours}h`;
      const days = Math.floor(totalHours / 24);
      const remHours = totalHours % 24;
      return remHours > 0 ? `${days}d${remHours}h` : `${days}d`;
    }

    function fmtResetClock(iso) {
      if (!iso) return '';
      const dt = new Date(iso);
      if (isNaN(dt.getTime())) return '';
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const hhmm = `${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
      const isSameDay =
        dt.getFullYear() === now.getFullYear() &&
        dt.getMonth() === now.getMonth() &&
        dt.getDate() === now.getDate();
      if (isSameDay) return hhmm;
      return `${pad(dt.getMonth() + 1)}/${pad(dt.getDate())} ${hhmm}`;
    }

    function fmtResetFull(iso) {
      if (!iso) return tHud('quotaResetUnknown');
      const diffMs = new Date(iso).getTime() - Date.now();
      if (diffMs <= 0) return tHud('quotaResetSoon');
      const clock = fmtResetClock(iso);
      const cd = fmtResetCountdown(diffMs);
      return `${clock} (${tHud('quotaResetLeft', cd)})`;
    }

    function fmtResetTime(iso) {
      if (!iso) return '';
      const diffMs = new Date(iso).getTime() - Date.now();
      if (diffMs <= 0) return `(${tHud('quotaResetSoon')})`;
      const clock = fmtResetClock(iso);
      const cd = fmtResetCountdown(diffMs);
      return `(${clock} · ${cd})`;
    }

    function getStateStyle(stateCode, hasRunningBg = false) {
      const isActive =
        hasRunningBg ||
        stateCode === 'BG_RUNNING' ||
        stateCode === 'SUB_RUNNING' ||
        stateCode === 'THINKING' ||
        stateCode === 'TOOL_RUNNING' ||
        stateCode === 'RUNNING';
      if (isActive) {
        return {
          dot: 'bg-sky-500 pulse-live',
          badge: 'bg-sky-500/15 text-sky-600 dark:text-sky-400 border-sky-500/35',
          cardClass: 'task-card-running',
          accentBar: 'bg-sky-500',
        };
      }
      return {
        dot: 'bg-emerald-500',
        badge: 'bg-emerald-500/12 text-emerald-600 dark:text-emerald-400 border-emerald-500/25',
        cardClass: '',
        accentBar: 'bg-emerald-500',
      };
    }

    function getCtxColor(pct) {
      if (pct >= 80) return 'bg-rose-500';
      if (pct >= 60) return 'bg-amber-500';
      return 'bg-emerald-500';
    }

    function getCtxTextColor(pct) {
      if (pct >= 80) return 'text-rose-600 dark:text-rose-400 font-bold';
      if (pct >= 60) return 'text-amber-600 dark:text-amber-400 font-semibold';
      return 'text-[var(--muted-foreground)]';
    }

    let isFetchingTelemetry = false;
    async function fetchTelemetry() {
      if (isFetchingTelemetry) return;
      isFetchingTelemetry = true;
      try {
        const fetcher = window.sidecar?.fetch || fetch;
        const res = await fetcher('/api/telemetry', {
          method: 'POST',
          body: JSON.stringify({ conversationId: window.selectedConvId || 'auto' })
        });
        if (!res.ok) return;
        const data = await res.json();
        if (data.uiVersion) {
          const prevVer = sessionStorage.getItem('agy_hud_ui_ver');
          sessionStorage.setItem('agy_hud_ui_ver', String(data.uiVersion));
          if (prevVer && prevVer !== String(data.uiVersion)) {
            reloadWithCacheBust(data.uiVersion);
            return;
          }
        }
        window.lastPayload = data;
        renderFingerprintLedger(data);
        if (typeof renderQuotaCalibration === 'function') renderQuotaCalibration(data);
        if (typeof renderPluginUpdater === 'function') renderPluginUpdater(data);
        renderFleet(data);
      } catch (err) {
        console.error('Telemetry fetch error:', err);
        const container = document.getElementById('fleetTasksContainer');
        if (container && !window.lastPayload) {
          container.innerHTML = `<div class="text-xs text-rose-500 text-center py-4">监控数据加载/渲染异常: ${escapeHtml(err?.message || err)}</div>`;
        }
      } finally {
        isFetchingTelemetry = false;
      }
    }

    let fpLedgerDrawerOpen = false;
    function toggleFpLedgerDrawer() {
      fpLedgerDrawerOpen = !fpLedgerDrawerOpen;
      const drawer = document.getElementById('fpLedgerDrawer');
      if (fpLedgerDrawerOpen) {
        drawer.classList.remove('hidden');
        if (lastPayload) renderFingerprintLedger(lastPayload);
      } else {
        drawer.classList.add('hidden');
      }
    }

    async function ackFingerprintChange(modelFamily = '') {
      try {
        const data = await callActionApi({ action: 'ack_fingerprint', modelFamily });
        showToast(data.message || '已更新指纹基线', !data.ok);
        await fetchTelemetry();
      } catch (err) {
        showToast('更新指纹基线失败: ' + err, true);
      }
    }

    function renderFingerprintLedger(data) {
      const ledger = data.fingerprintLedger || { baselines: [], events: [], unackedCount: 0 };
      const baselines = ledger.baselines || [];
      const events = ledger.events || [];
      const changedBaselines = baselines.filter(b => b.status === 'CHANGED');

      const btnLabel = document.getElementById('fpLedgerBtnLabel');
      const btn = document.getElementById('fpLedgerBtn');
      const hint = document.getElementById('fpLedgerMenuHint');
      if (changedBaselines.length > 0 || ledger.unackedCount > 0) {
        if (btnLabel) btnLabel.textContent = tHud('btnSig');
        if (hint) {
          hint.textContent = `⚠ ${changedBaselines.length || ledger.unackedCount}`;
          hint.className = 'text-[10px] mono font-bold text-amber-600 dark:text-amber-400';
        }
        if (btn) btn.className = 'hud-menu-item text-amber-600 dark:text-amber-400 font-bold';
      } else {
        if (btnLabel) btnLabel.textContent = tHud('btnSig');
        if (hint) {
          hint.textContent = `(${baselines.length})`;
          hint.className = 'text-[10px] mono text-[var(--muted-foreground)]';
        }
        if (btn) btn.className = 'hud-menu-item';
      }
      if (typeof window.syncHudMoreDot === 'function') window.syncHudMoreDot();

      const banner = document.getElementById('fpAlertBanner');
      if (changedBaselines.length > 0) {
        banner.classList.remove('hidden');
        banner.innerHTML = changedBaselines.map(b => `
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-1.5">
              <span class="text-sm">🔑</span>
              <span class="font-bold text-amber-600 dark:text-amber-400">${escapeHtml(tHud('fpAlertTitle', changedBaselines.length))}:</span>
              <span class="mono font-bold text-[var(--foreground)]">${escapeHtml(b.modelFamily)}</span>
              <span class="mono text-[11px] text-[var(--muted-foreground)]">
                <code class="px-1 py-0.5 rounded bg-[var(--card)] border border-[var(--hud-border)]">0x${escapeHtml(b.baselineKeyHex)}</code>
                → <code class="px-1 py-0.5 rounded bg-amber-500/20 text-amber-600 dark:text-amber-300 border border-amber-500/40 font-bold">0x${escapeHtml(b.latestKeyHex)}</code>
              </span>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="ackFingerprintChange('${escapeHtml(b.modelFamily)}')"
                      class="px-2.5 py-0.5 rounded-md bg-amber-600 text-white hover:bg-amber-500 font-semibold text-[11px] transition shadow-sm">
                ${escapeHtml(tHud('fpAckAll'))}
              </button>
            </div>
          </div>
        `).join('');
      } else {
        banner.classList.add('hidden');
        banner.innerHTML = '';
      }

      const drawer = document.getElementById('fpLedgerDrawer');
      if (!fpLedgerDrawerOpen) return;

      drawer.innerHTML = `
        <div class="flex items-center justify-between border-b border-[var(--hud-border)] pb-1.5">
          <div class="flex items-center gap-1.5 text-xs font-bold flex-wrap">
            <span>${escapeHtml(tHud('fpDrawerTitle'))}</span>
          </div>
          <button onclick="toggleFpLedgerDrawer()" class="text-[11px] px-2 py-0.5 rounded border border-[var(--hud-border)] text-[var(--muted-foreground)] hover:text-[var(--foreground)] whitespace-nowrap">
            ${escapeHtml(tHud('fpClose'))} ✕
          </button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
          ${baselines.length === 0 ? `<div class="text-xs text-[var(--muted-foreground)] py-1">${escapeHtml(tHud('fpEmpty'))}</div>` : baselines.map(b => {
            const isChanged = b.status === 'CHANGED';
            const statusHtml = isChanged
              ? `<span class="px-1.5 py-0.5 rounded bg-amber-500/15 text-amber-600 dark:text-amber-400 border border-amber-500/35 text-[10px] font-bold">${escapeHtml(tHud('fpChanged'))}</span>`
              : `<span class="px-1.5 py-0.5 rounded bg-slate-500/12 text-[var(--muted-foreground)] border border-[var(--hud-border)] text-[10px] font-medium">${escapeHtml(tHud('fpMatched'))}</span>`;
            return `
              <div class="bg-[var(--card)] border border-[var(--hud-border)] rounded-lg px-2.5 py-1.5 flex items-center justify-between gap-2 text-xs mono">
                <div class="min-w-0">
                  <div class="flex items-center gap-1.5">
                    <strong class="text-sky-600 dark:text-sky-400 truncate">${escapeHtml(b.modelFamily)}</strong>
                    ${statusHtml}
                  </div>
                  <div class="text-[11px] text-[var(--muted-foreground)] mt-0.5">
                    Key: <strong class="text-indigo-600 dark:text-indigo-400">0x${escapeHtml(b.latestKeyHex)}</strong>
                    ${isChanged ? `(0x${escapeHtml(b.baselineKeyHex)})` : ''} · ${escapeHtml(b.apiProvider)}
                  </div>
                </div>
                <div class="text-right text-[10px] text-[var(--muted-foreground)] shrink-0">
                  <div>×${fmtNum(b.verifiedCount || 1)}</div>
                  <div>${fmtAgo(b.lastSeenMs)}</div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
        ${events.length > 0 ? `
          <div class="pt-1 border-t border-[var(--hud-border)]/60 space-y-1">
            <div class="max-h-24 overflow-y-auto space-y-1 text-[11px] mono">
              ${events.slice(0, 6).map(e => {
                const tag = e.type === 'KEY_CHANGED'
                  ? `<span class="text-rose-500 font-bold">[KEY]</span> 0x${escapeHtml(e.prevKeyHex)} → 0x${escapeHtml(e.newKeyHex)}`
                  : `<span class="text-emerald-600 dark:text-emerald-400">[INIT]</span> 0x${escapeHtml(e.newKeyHex)}`;
                return `<div class="flex items-center justify-between text-[var(--muted-foreground)]">
                  <span class="truncate">${tag} · ${escapeHtml(e.modelFamily)} (${escapeHtml(e.conversationTitle || '')})</span>
                  <span class="shrink-0 ml-2">${fmtAgo(e.timestampMs)}</span>
                </div>`;
              }).join('')}
            </div>
          </div>
        ` : ''}
      `;
    }
    function getDiagTagStyle(diag) {
      if (!diag) return { cls: 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-emerald-500/25 font-semibold', label: trDiagLabel(null), detail: '' };
      const label = trDiagLabel(diag);
      if (diag.level === 'ALERT') {
        return {
          cls: 'bg-rose-500/15 text-rose-600 dark:text-rose-400 border-rose-500/40 font-bold pulse-live',
          label,
          detail: diag.detail || '',
        };
      }
      if (diag.level === 'WARN') {
        return {
          cls: 'bg-amber-500/15 text-amber-600 dark:text-amber-400 border-amber-500/40 font-bold',
          label,
          detail: diag.detail || '',
        };
      }
      if (diag.level === 'INFO') {
        return {
          cls: 'bg-amber-500/10 text-amber-600/90 dark:text-amber-400/90 border-amber-500/25 font-medium',
          label,
          detail: diag.detail || '',
        };
      }
      return {
        cls: 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-emerald-500/25 font-semibold',
        label,
        detail: diag.detail || '',
      };
    }
    function renderCodexProgressTray(convId, cp, isLinkedFromAgy = false, linkedMeta = null) {
      if (!cp) return '';
      const isTimelineOpen = openCodexTimelines.has(convId);
      const actions = cp.recentActions || [];
      const hasContent = cp.isRunning || cp.latestCommentary || cp.currentAction || actions.length > 0;
      if (!hasContent) return '';

      if (!cp.isRunning && !isTimelineOpen) {
        const summaryText = cp.latestCommentary || cp.currentAction || `${cp.stepCount || 1} steps`;
        return `
          <div class="mt-1.5 pt-1.5 border-t border-[var(--hud-border)]/70 flex flex-wrap items-center justify-between gap-x-2 gap-y-1 text-[11px]"
               onclick="event.stopPropagation()">
            <div class="flex items-center gap-1.5 min-w-[160px] flex-1 text-[var(--muted-foreground)]">
              <span class="px-1.5 py-0.2 rounded bg-emerald-500/12 text-emerald-600 dark:text-emerald-400 border border-emerald-500/25 mono font-semibold shrink-0">
                ${isLinkedFromAgy ? escapeHtml(tHud('codexSynergyDone', linkedMeta?.exactModelId || 'Codex')) : escapeHtml(tHud('codexDoneSummary', cp.turnNumber || 1, cp.stepCount || 0, cp.cmdCount || 0, cp.fileChangeCount || 0))}
              </span>
              <span class="truncate text-[var(--foreground)]/90" title="${escapeHtml(summaryText)}">
                💬 ${escapeHtml(summaryText)}
              </span>
            </div>
            <div class="flex items-center gap-1 shrink-0 mono ml-auto">
              ${cp.elapsedSec > 0 ? `<span class="px-1.5 py-0.5 rounded bg-[var(--muted)] text-[var(--muted-foreground)]">${escapeHtml(tHud('durPrefix'))} ${fmtElapsed(cp.elapsedSec)}</span>` : ''}
              ${actions.length > 0 ? `
                <button onclick="toggleCodexTimeline(event, '${convId}')"
                        class="px-2 py-0.5 rounded border border-[var(--hud-border)] bg-[var(--card)] hover:border-emerald-500/50 hover:text-emerald-600 font-sans font-medium transition">
                  ${escapeHtml(tHud('codexTraceBtn', actions.length))}
                </button>
              ` : ''}
              ${isLinkedFromAgy && linkedMeta?.conversationId ? `
                <button onclick="jumpToConversation(event, '${linkedMeta.conversationId}')"
                        class="px-2 py-0.5 rounded border border-emerald-500/35 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 hover:bg-emerald-500/20 font-sans font-semibold transition">
                  Codex ↗
                </button>
              ` : ''}
            </div>
          </div>
        `;
      }

      return `
        <div class="mt-2 pt-2 border-t border-[var(--hud-border)]/80" onclick="event.stopPropagation()">
          <div class="rounded-xl px-3 py-2.5 space-y-2 border ${cp.isRunning ? 'border-emerald-500/45 bg-emerald-500/8' : 'border-[var(--hud-border)] bg-[var(--background)]/75'}">
            <div class="flex flex-wrap items-center justify-between gap-x-3 gap-y-1.5 text-xs">
              <div class="flex flex-wrap items-center gap-1.5 min-w-0">
                <span class="w-2 h-2 rounded-full ${cp.isRunning ? 'bg-emerald-500 pulse-live' : 'bg-emerald-500'} shrink-0"></span>
                <span class="font-bold text-emerald-600 dark:text-emerald-400 whitespace-nowrap">
                  ${cp.isRunning
                    ? (isLinkedFromAgy ? escapeHtml(tHud('codexSynergyRun', linkedMeta?.exactModelId || '')) : escapeHtml(tHud('codexProgressRun')))
                    : (isLinkedFromAgy ? escapeHtml(tHud('codexSynergyDone', linkedMeta?.exactModelId || '')) : escapeHtml(tHud('codexProgressDone')))}
                </span>
                <span class="mono text-[11px] px-2 py-0.5 rounded-md border border-emerald-500/30 bg-emerald-500/12 text-emerald-700 dark:text-emerald-300 whitespace-nowrap font-medium">
                  ${escapeHtml(tHud('codexTurnBadge', cp.turnNumber || 1, cp.isRunning, cp.stepCount || 0, cp.cmdCount || 0, cp.fileChangeCount || 0))}
                </span>
              </div>

              <div class="flex items-center gap-1.5 shrink-0 mono ml-auto">
                <span class="${cp.isRunning ? 'text-emerald-600 dark:text-emerald-400 bg-emerald-500/12 border-emerald-500/25' : 'text-[var(--muted-foreground)] bg-[var(--muted)] border-[var(--hud-border)]'} font-bold text-[11px] px-2 py-0.5 rounded-md border whitespace-nowrap">
                  ${cp.isRunning ? `⏱ ${fmtElapsed(cp.elapsedSec)}` : `✅ ${fmtElapsed(cp.elapsedSec)}`}
                </span>
                ${actions.length > 0 ? `
                  <button onclick="toggleCodexTimeline(event, '${convId}')"
                          class="px-2 py-0.5 rounded-md border border-[var(--hud-border)] bg-[var(--card)] hover:border-emerald-500/50 hover:text-emerald-600 transition text-[11px] font-sans font-medium whitespace-nowrap">
                    ${isTimelineOpen ? escapeHtml(tHud('codexTraceHide')) : escapeHtml(tHud('codexTraceFullBtn', actions.length))}
                  </button>
                ` : ''}
                ${isLinkedFromAgy && linkedMeta?.conversationId ? `
                  <button onclick="jumpToConversation(event, '${linkedMeta.conversationId}')"
                          class="px-2 py-0.5 rounded-md border border-emerald-500/35 bg-emerald-500/12 text-emerald-600 dark:text-emerald-400 hover:bg-emerald-500/25 font-sans font-semibold transition text-[11px] whitespace-nowrap">
                    Codex ↗
                  </button>
                ` : ''}
                ${cp.isRunning && cp.bridgePid ? `
                  <button type="button" onclick="stopCodexTurn(event, '${cp.threadId}')"
                          class="px-2 py-0.5 rounded-md border border-[var(--hud-border)] bg-[var(--hud-surface)] text-[var(--muted-foreground)] hover:text-rose-600 dark:hover:text-rose-400 hover:border-rose-500/40 font-sans font-medium text-[11px] whitespace-nowrap">
                    ${escapeHtml(tHud('bgStop'))}
                  </button>
                ` : ''}
              </div>
            </div>

            ${cp.latestCommentary ? `
              <div class="text-xs text-[var(--foreground)] bg-[var(--card)]/90 px-2.5 py-2 rounded-lg border border-[var(--hud-border)]/80 leading-relaxed">
                <span class="font-bold text-emerald-600 dark:text-emerald-400 mr-1">${escapeHtml(cp.isRunning ? tHud('codexCommentRun') : tHud('codexCommentDone'))}</span>
                <span>${escapeHtml(cp.latestCommentary)}</span>
              </div>
            ` : ''}

            ${cp.isRunning && cp.currentAction ? `
              <div class="text-[11px] mono text-[var(--muted-foreground)] truncate bg-[var(--card)]/75 px-2.5 py-1 rounded-md border border-[var(--hud-border)]/60"
                   title="${escapeHtml(cp.currentAction)}">
                ${escapeHtml(cp.currentAction)}
              </div>
            ` : ''}

            ${isTimelineOpen && actions.length > 0 ? `
              <div data-scroll-id="codex-tl-${escapeHtml(convId)}"
                   class="mt-1 bg-slate-950 border border-slate-800 rounded-lg p-2.5 space-y-1.5 text-slate-200 max-h-48 overflow-y-auto">
                <div class="text-[10px] text-slate-400 mono border-b border-slate-800 pb-1 flex items-center justify-between">
                  <span>Codex (${actions.length})</span>
                  <span>Thread: ${escapeHtml((cp.threadId || '').slice(0, 8))}</span>
                </div>
                ${[...actions].reverse().map(act => `
                  <div class="text-[11px] mono flex items-start gap-1.5 py-0.5 border-b border-slate-900/80 last:border-0 leading-relaxed">
                    <span class="text-slate-500 shrink-0">[${escapeHtml(act.timeStr || '--')}]</span>
                    <span class="shrink-0">${act.icon || '•'}</span>
                    <span class="${act.kind === 'COMMENTARY' ? 'text-emerald-300 font-sans' : act.kind === 'FILE' ? 'text-amber-300' : 'text-slate-200'} break-all">${escapeHtml(act.summary)}</span>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }
  </script>
  <script src="/ui_i18n.js"></script>
  <script src="/ui_card_metrics.js"></script>
  <script src="/ui_subagent_tray.js"></script>
  <script src="/ui_turn_list.js"></script>
  <script src="/ui_inline_detail.js"></script>
  <script src="/ui_quota_calibration.js"></script>
  <script src="/ui_updater.js"></script>
  <script src="/ui_fleet_cards.js"></script>
  <script>
    if (typeof window.applyStaticI18n === 'function') window.applyStaticI18n();
    const initScan = document.getElementById('initialScanningMsg');
    if (initScan && typeof window.tHud === 'function') initScan.textContent = window.tHud('scanning');
    updateFilterButtonsUI(); fetchTelemetry(); setInterval(fetchTelemetry, 1500);
  </script>
</body>
</html>
